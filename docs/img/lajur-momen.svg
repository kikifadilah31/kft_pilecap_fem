<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="judul">
  <title id="judul">Lajur momen desain arah X dan Y</title>
  <style>
    :root { color-scheme: light dark; }
    .cap  { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .pier { fill: #f87171; fill-opacity: .25; stroke: #b91c1c; stroke-width: 1.5; }
    .pile { fill: #38bdf8; fill-opacity: .25; stroke: #0369a1; stroke-width: 1.2; }
    .div  { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 3; }
    .cut  { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; }
    .t   { font: 13px sans-serif; fill: #334155; }
    .tb  { font: 500 13px sans-serif; fill: #0f172a; }
    .ts  { font: 11.5px sans-serif; fill: #64748b; }
    .num { font: 11.5px sans-serif; fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      .t {fill:#cbd5e1;} .tb {fill:#f1f5f9;} .ts {fill:#94a3b8;}
      .cap {stroke:#60a5fa;} .pier {stroke:#f87171;} .pile {stroke:#38bdf8;}
      .div {stroke:#64748b;} .cut {stroke:#fbbf24;} .num {fill:#fbbf24;}
    }
  </style>

  <text class="tb" x="185" y="30" text-anchor="middle">strips_x = 5</text>
  <text class="ts" x="185" y="48" text-anchor="middle">→ momen m_xx → tulangan arah X</text>

  <rect class="cap" x="60" y="70" width="250" height="250"/>
  <line class="div" x1="60" y1="120" x2="310" y2="120"/>
  <line class="div" x1="60" y1="170" x2="310" y2="170"/>
  <line class="div" x1="60" y1="220" x2="310" y2="220"/>
  <line class="div" x1="60" y1="270" x2="310" y2="270"/>
  <rect class="pier" x="154" y="164" width="62" height="62"/>
  <circle class="pile" cx="123" cy="133" r="21"/>
  <circle class="pile" cx="247" cy="133" r="21"/>
  <circle class="pile" cx="123" cy="257" r="21"/>
  <circle class="pile" cx="247" cy="257" r="21"/>
  <line class="cut" x1="154" y1="70" x2="154" y2="320"/>
  <line class="cut" x1="216" y1="70" x2="216" y2="320"/>
  <text class="ts" x="154" y="62" text-anchor="middle">sisi min</text>
  <text class="ts" x="216" y="62" text-anchor="middle">sisi maks</text>
  <text class="num" x="52" y="99"  text-anchor="end">5</text>
  <text class="num" x="52" y="149" text-anchor="end">4</text>
  <text class="num" x="52" y="199" text-anchor="end">3</text>
  <text class="num" x="52" y="249" text-anchor="end">2</text>
  <text class="num" x="52" y="299" text-anchor="end">1</text>
  <text class="ts" x="185" y="340" text-anchor="middle">potongan ⟂ sumbu X, dibagi sepanjang Y</text>

  <text class="tb" x="565" y="30" text-anchor="middle">strips_y = 5</text>
  <text class="ts" x="565" y="48" text-anchor="middle">→ momen m_yy → tulangan arah Y</text>

  <rect class="cap" x="440" y="70" width="250" height="250"/>
  <line class="div" x1="490" y1="70" x2="490" y2="320"/>
  <line class="div" x1="540" y1="70" x2="540" y2="320"/>
  <line class="div" x1="590" y1="70" x2="590" y2="320"/>
  <line class="div" x1="640" y1="70" x2="640" y2="320"/>
  <rect class="pier" x="534" y="164" width="62" height="62"/>
  <circle class="pile" cx="503" cy="133" r="21"/>
  <circle class="pile" cx="627" cy="133" r="21"/>
  <circle class="pile" cx="503" cy="257" r="21"/>
  <circle class="pile" cx="627" cy="257" r="21"/>
  <line class="cut" x1="440" y1="164" x2="690" y2="164"/>
  <line class="cut" x1="440" y1="226" x2="690" y2="226"/>
  <text class="ts" x="698" y="168">sisi maks</text>
  <text class="ts" x="698" y="230">sisi min</text>
  <text class="num" x="465" y="338" text-anchor="middle">1</text>
  <text class="num" x="515" y="338" text-anchor="middle">2</text>
  <text class="num" x="565" y="338" text-anchor="middle">3</text>
  <text class="num" x="615" y="338" text-anchor="middle">4</text>
  <text class="num" x="665" y="338" text-anchor="middle">5</text>
  <text class="ts" x="565" y="358" text-anchor="middle">potongan ⟂ sumbu Y, dibagi sepanjang X</text>

  <text class="t" x="30" y="392">Tiap perpotongan lajur × potongan menghasilkan SATU momen desain, lalu satu nilai As.</text>
  <text class="ts" x="30" y="412">Pada ex01 (5 lajur × 2 sisi × 2 arah) hasilnya 20 baris — persis isi tabel calc_sheet.md bagian 7a dan strip_moments_*.csv.</text>
  <text class="ts" x="30" y="430">Garis oranye = lokasi potongan ketika moment_at = "pier_face" (bawaan, dan satu-satunya yang sah dipakai desain).</text>
</svg>
