[project]
name = "pilecap-fem"
dynamic = ["version"]
description = "Automated pile cap plate-bending analyzer (gmsh + OpenSeesPy)"
readme = "README.md"
# Batas bawah 3.12 ditentukan openseespywin (requires_python >= 3.12).
#
# Batas atas <3.13 WAJIB, bukan sekadar konservatif. DIUKUR: openseespy 3.8.0.0
# BERHASIL DIPASANG di Python 3.13 -- wheel-nya bertag `py3-none-win_amd64` sehingga
# lolos pemeriksaan pip/uv -- tetapi GAGAL DIIMPOR:
#
#     RuntimeError: Failed to import openseespy on Windows:
#     DLL load failed while importing opensees
#
# `.pyd` di dalamnya dibangun untuk CPython 3.12. Tanpa batas atas ini, uv akan dengan
# senang hati memasang kombinasi yang rusak dan kegagalannya baru muncul saat analisis
# dijalankan. `uvx` menyediakan Python 3.12 sendiri bila pengguna belum punya.
requires-python = ">=3.12,<3.13"
license-files = ["LICENSE"]
authors = [{ name = "Kiki Fadilah Tanjung" }]
# Paket proprietary: cegah ter-unggah ke PyPI karena kecelakaan.
classifiers = ["Private :: Do Not Upload"]

# PINNING EKSAK (PRD Bagian 10 & Bagian 1.3).
#
# Angka di bawah BUKAN "yang terbaru saat itu" melainkan versi yang benar-benar lolos
# VC-0..VC-5 pada Python 3.12.4. Dipakai `==` karena `uvx`/`uv tool install` dari git
# MENGABAIKAN uv.lock dan me-resolve ulang dari berkas ini: dengan rentang longgar, dua
# pengguna yang menginstal di hari berbeda dapat menjalankan numerik yang berbeda.
#
# gmsh paling kritis -- penomoran Mesh.Algorithm / Mesh.RecombinationAlgorithm adalah
# bagian dari kontrak numerik tool ini (lihat config.GMSH_*). openseespy yang di-pin,
# bukan openseespywin: meta-package itulah yang memilih paket per platform.
#
# Menaikkan salah satu versi = menjalankan ulang seluruh validation case lalu mencatat
# hasilnya di CHANGELOG.md.
#
# shell-kit menyediakan seluruh cek kapasitas SNI 2847:2019 beserta sitasi pasalnya.
# Diimpor sebagai dependency, BUKAN disalin, supaya rumus SNI hidup di satu repo saja --
# dua salinan rumus yang bisa menyimpang diam-diam adalah hal terakhir yang boleh terjadi
# pada tool yang angkanya dipakai untuk desain (PRD Bagian 1.3).
# Direct reference sah karena paket ini tidak pernah diunggah ke PyPI.
dependencies = [
    "gmsh==4.15.2",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "shapely==2.1.2",
    "matplotlib==3.11.1",
    "tqdm==4.70.0",
    "openseespy==3.8.0.0",
    "opsvis==1.3.7",
    "shell-kit @ git+https://github.com/kikifadilah31/plot_kontur_plate_fea_midas_civil@v3.3.0",
]

[project.scripts]
pilecap-mesh = "pilecap_fem.cli_pilecap_mesh:entry_point"
pilecap-analyze = "pilecap_fem.cli_pilecap_analyze:entry_point"
pilecap-report = "pilecap_fem.cli_pilecap_report:entry_point"
pilecap-run = "pilecap_fem.cli_pilecap_run:entry_point"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-shapely",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Versi dibaca dari __init__.py -- SATU sumber, bukan dua yang bisa menyimpang.
[tool.hatch.version]
path = "src/pilecap_fem/__init__.py"

# Diperlukan untuk dependency `shell-kit @ git+...`. Hatchling memblokirnya secara default
# karena paket ber-direct-reference tidak dapat diunggah ke PyPI -- dan itu memang yang
# kita inginkan di sini (classifier `Private :: Do Not Upload`).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pilecap_fem"]

# Contoh ikut dikemas agar pengguna `uvx` -- yang tidak meng-clone repo -- tetap dapat
# mencoba tool ini lewat `--init-example`. File yang dikemas adalah file yang SAMA dengan
# yang dipakai test regresi, sehingga tidak bisa basi diam-diam.
#
# Termasuk `expected/golden.json` per contoh (~140 KB total, PRD Bagian 5.4). Ukurannya
# sepadan: tanpa itu pengguna `uvx` hanya dapat memastikan tool BERJALAN, tidak dapat
# memastikan angkanya sama dengan angka acuan.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "pilecap_fem/examples"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode di string laporan berbahasa Indonesia (mis. tanda × ÷ ≥)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Baris tabel Markdown di dalam f-string tidak bisa dipotong tanpa merusak tabelnya.
"src/pilecap_fem/reporter.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# false: override untuk openseespy/opsvis sengaja sudah didaftarkan sekarang meskipun
# modulnya baru diimpor pada Fase 2.
warn_unused_configs = false
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["gmsh", "opsvis", "openseespy.*", "shell_kit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: test yang menjalankan meshing penuh (beberapa detik per kasus)",
]
