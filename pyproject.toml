[project]
name = "pilecap-fem"
version = "0.1.0"
description = "Automated pile cap plate-bending analyzer (gmsh + OpenSeesPy)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kiki Fadilah Tanjung" }]

# CATATAN PINNING (PRD Bagian 10 & Bagian 17 item 16):
# Versi di bawah adalah batas kerja saat pengembangan. Versi EKSAK yang terbukti lulus
# seluruh validation case dikunci di uv.lock dan dicatat di CHANGELOG.md saat rilis.
# gmsh di-pin ketat karena penomoran Mesh.Algorithm / Mesh.RecombinationAlgorithm
# adalah bagian dari kontrak numerik tool ini (lihat config.GMSH_*).
dependencies = [
    "gmsh==4.15.2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "shapely>=2.0,<3",
    "matplotlib>=3.8,<4",
    "tqdm>=4.66,<5",
    # Dipakai mulai Fase 2/3. Dideklarasikan sekarang agar environment tervalidasi sejak awal.
    "openseespy>=3.8.0.0",
    "opsvis>=1.3.7",
]

[project.scripts]
pilecap-mesh = "pilecap_fem.cli_pilecap_mesh:entry_point"
pilecap-analyze = "pilecap_fem.cli_pilecap_analyze:entry_point"
pilecap-report = "pilecap_fem.cli_pilecap_report:entry_point"
pilecap-run = "pilecap_fem.cli_pilecap_run:entry_point"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-shapely",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilecap_fem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode di string laporan berbahasa Indonesia (mis. tanda × ÷ ≥)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Baris tabel Markdown di dalam f-string tidak bisa dipotong tanpa merusak tabelnya.
"src/pilecap_fem/reporter.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# false: override untuk openseespy/opsvis sengaja sudah didaftarkan sekarang meskipun
# modulnya baru diimpor pada Fase 2.
warn_unused_configs = false
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["gmsh", "opsvis", "openseespy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: test yang menjalankan meshing penuh (beberapa detik per kasus)",
]
