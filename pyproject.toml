[project]
name = "pilecap-fem"
dynamic = ["version"]
description = "Automated pile cap plate-bending analyzer (gmsh + OpenSeesPy)"
readme = "README.md"
# Batas bawah 3.12 ditentukan openseespywin (requires_python >= 3.12).
#
# Batas atas <3.13 WAJIB, bukan sekadar konservatif. DIUKUR: openseespy 3.8.0.0
# BERHASIL DIPASANG di Python 3.13 -- wheel-nya bertag `py3-none-win_amd64` sehingga
# lolos pemeriksaan pip/uv -- tetapi GAGAL DIIMPOR:
#
#     RuntimeError: Failed to import openseespy on Windows:
#     DLL load failed while importing opensees
#
# `.pyd` di dalamnya dibangun untuk CPython 3.12. Tanpa batas atas ini, uv akan dengan
# senang hati memasang kombinasi yang rusak dan kegagalannya baru muncul saat analisis
# dijalankan. `uvx` menyediakan Python 3.12 sendiri bila pengguna belum punya.
requires-python = ">=3.12,<3.13"
license-files = ["LICENSE"]
authors = [{ name = "Kiki Fadilah Tanjung" }]
# Paket proprietary: cegah ter-unggah ke PyPI karena kecelakaan.
classifiers = ["Private :: Do Not Upload"]

# PINNING EKSAK (PRD Bagian 10 & Bagian 1.3).
#
# Angka di bawah BUKAN "yang terbaru saat itu" melainkan versi yang benar-benar lolos
# VC-0..VC-5 pada Python 3.12.4. Dipakai `==` karena `uvx`/`uv tool install` dari git
# MENGABAIKAN uv.lock dan me-resolve ulang dari berkas ini: dengan rentang longgar, dua
# pengguna yang menginstal di hari berbeda dapat menjalankan numerik yang berbeda.
#
# gmsh paling kritis -- penomoran Mesh.Algorithm / Mesh.RecombinationAlgorithm adalah
# bagian dari kontrak numerik tool ini (lihat config.GMSH_*). openseespy yang di-pin,
# bukan openseespywin: meta-package itulah yang memilih paket per platform.
#
# Menaikkan salah satu versi = menjalankan ulang seluruh validation case lalu mencatat
# hasilnya di CHANGELOG.md.
#
# shell-kit menyediakan seluruh cek kapasitas SNI 2847:2019 beserta sitasi pasalnya.
# Diimpor sebagai dependency, BUKAN disalin, supaya rumus SNI hidup di satu repo saja --
# dua salinan rumus yang bisa menyimpang diam-diam adalah hal terakhir yang boleh terjadi
# pada tool yang angkanya dipakai untuk desain (PRD Bagian 1.3).
# Direct reference sah karena paket ini tidak pernah diunggah ke PyPI.
#
# URL wheel, BUKAN `git+...`. Sengaja: `git+` memaksa git terpasang di mesin PEMASANG,
# bukan hanya di mesin pengembang -- pengguna lapangan yang cuma menjalankan `uv sync`
# tanpa git akan gagal instalasi dengan pesan yang seolah tidak berkaitan. Wheel-nya
# dibangun sekali dari sumber tag v3.3.0 lalu diunggah sebagai release asset di repo
# yang sama (https://github.com/kikifadilah31/plot_kontur_plate_fea_midas_civil/releases/tag/v3.3.0);
# isinya identik dengan checkout tag itu, hanya jalur pengambilannya lewat HTTPS biasa.
dependencies = [
    "gmsh==4.15.2",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "shapely==2.1.2",
    "matplotlib==3.11.1",
    "tqdm==4.70.0",
    "openseespy==3.8.0.0",
    "opsvis==1.3.7",
    "shell-kit @ https://github.com/kikifadilah31/plot_kontur_plate_fea_midas_civil/releases/download/v3.3.0/shell_kit-3.3.0-py3-none-any.whl",
    # Laporan PDF (`--pdf`). Keduanya SUDAH ikut secara transitif -- `typst` lewat
    # shell-kit, `pillow` lewat matplotlib -- sehingga menuliskannya di sini menambah NOL
    # byte pada instalasi. Tetap dituliskan karena dependency transitif bukan kontrak:
    # `uvx`/`uv tool install` dari git MENGABAIKAN uv.lock dan me-resolve ulang dari berkas
    # ini, dan bila shell-kit atau matplotlib berhenti membutuhkannya, `--pdf` akan mati
    # pada instalasi baru dengan ImportError yang membingungkan. `shell_kit.pdf` mengimpor
    # PIL secara langsung, jadi pillow memang dependency langsung fitur ini.
    #
    # ALASAN PIN-nya BERBEDA dari yang di atas: keduanya tidak menyentuh satu pun angka
    # rekayasa dan tidak ikut satu pun validation case. Yang dijaga adalah DOKUMEN yang
    # reproducible -- pergeseran tata letak antar versi Typst menggeser penomoran halaman
    # pada dokumen yang sudah ditandatangani. Konsekuensinya, menaikkan keduanya TIDAK
    # menuntut VC-0..VC-7 diulang, berbeda dari gmsh/openseespy/numpy.
    "typst==0.15.0",
    "pillow==12.3.0",
]

# SATU-SATUNYA dependency yang TIDAK di-pin eksak, dan itu disengaja.
#
# Alasan pin eksak di atas adalah numerik: angka-angka itu versi yang benar-benar lolos
# VC-0..VC-5. Streamlit tidak ikut satu pun validation case dan tidak menyentuh satu pun
# angka rekayasa -- antarmuka hanya menyusun daftar argumen lalu memanggil CLI. Menyematkan
# versinya secara eksak berarti meniru aturan tanpa membawa alasannya.
#
# Batas bawah 1.57 dibutuhkan `st.segmented_control`, `st.status`, container ber-border,
# dan ikon `:material/`. Opsional supaya pengguna CLI tidak ikut memasang ~40 MB Streamlit
# beserta dependensinya hanya untuk menjalankan analisis.
[project.optional-dependencies]
ui = ["streamlit>=1.57"]
# Antarmuka desktop native. Terpisah dari `ui` karena keduanya berdiri sendiri:
# pengguna yang memakai jendela wx tidak perlu menarik server Streamlit, dan
# sebaliknya. wxPython tidak membawa dependency lain sama sekali (DIUKUR).
gui = ["wxpython>=4.2"]
# Antarmuka desktop ketiga (PySide6), EKSPERIMENTAL: disediakan untuk dibandingkan
# dengan `gui` sebelum salah satunya dipilih. `pyside6-essentials`, bukan `pyside6`:
# paket utuh ikut menarik WebEngine/PDF/Addons (~244 MB unduhan, DIUKUR) yang tidak
# dipakai; essentials ~79 MB. >=6.5 karena `QFormLayout.setRowVisible` (Qt 6.4+).
qt = ["pyside6-essentials>=6.5"]

[project.scripts]
pilecap-mesh = "pilecap_fem.cli_pilecap_mesh:entry_point"
pilecap-analyze = "pilecap_fem.cli_pilecap_analyze:entry_point"
pilecap-report = "pilecap_fem.cli_pilecap_report:entry_point"
pilecap-run = "pilecap_fem.cli_pilecap_run:entry_point"
pilecap-ui = "pilecap_fem.ui.launcher:entry_point"
pilecap-manual = "pilecap_fem.cli_pilecap_manual:entry_point"
pilecap-gui = "pilecap_fem.ui.wx_launcher:entry_point"
pilecap-qt = "pilecap_fem.ui.qt_launcher:entry_point"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-shapely",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Versi dibaca dari __init__.py -- SATU sumber, bukan dua yang bisa menyimpang.
[tool.hatch.version]
path = "src/pilecap_fem/__init__.py"

# Diperlukan untuk dependency `shell-kit @ https://...whl` (direct reference URL).
# Hatchling memblokirnya secara default karena paket ber-direct-reference tidak dapat
# diunggah ke PyPI -- dan itu memang yang kita inginkan di sini (classifier
# `Private :: Do Not Upload`).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pilecap_fem"]

# Contoh ikut dikemas agar pengguna `uvx` -- yang tidak meng-clone repo -- tetap dapat
# mencoba tool ini lewat `--init-example`. File yang dikemas adalah file yang SAMA dengan
# yang dipakai test regresi, sehingga tidak bisa basi diam-diam.
#
# Termasuk `expected/golden.json` per contoh (~140 KB total, PRD Bagian 5.4). Ukurannya
# sepadan: tanpa itu pengguna `uvx` hanya dapat memastikan tool BERJALAN, tidak dapat
# memastikan angkanya sama dengan angka acuan.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "pilecap_fem/examples"

# Ilustrasi ikut dikemas karena `pilecap-ui` menampilkannya DI DALAM formulir. Tanpa ini
# justru pengguna `uvx`/wheel -- yang paling terbantu gambar -- yang kehilangannya, dan
# kegagalannya tidak terlihat di repo karena `config.illustrations_dir()` punya fallback
# ke `docs/img/`. Isi wheel karena itu diperiksa terpisah
# (`tests/test_packaging.py::test_wheel_memuat_ilustrasi`). Ukurannya 24 KB.
"docs/img" = "pilecap_fem/docs_img"

[tool.ruff]
line-length = 100
target-version = "py312"
# `docs/` memuat KUTIPAN kode dari proyek lain (mis. potongan `shell_kit/rebar.py` di
# CATATAN_SHELL_KIT.md sebagai bukti sebuah vonis). Memformat ulang kutipan berarti
# mengubahnya, dan kutipan yang sudah diubah tidak lagi membuktikan apa pun.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode di string laporan berbahasa Indonesia (mis. tanda × ÷ ≥)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Baris tabel Markdown di dalam f-string tidak bisa dipotong tanpa merusak tabelnya.
"src/pilecap_fem/reporter.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# false: override untuk openseespy/opsvis sengaja sudah didaftarkan sekarang meskipun
# modulnya baru diimpor pada Fase 2.
warn_unused_configs = false
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["gmsh", "opsvis", "openseespy.*", "shell_kit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: test yang menjalankan meshing penuh (beberapa detik per kasus)",
]
